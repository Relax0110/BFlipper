name: BFlipper installers

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bflipper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Package Debian installer
        run: bash installers/debian/package-installer.sh "0.1.0+${GITHUB_SHA::7}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: BFlipper-Debian12-Installer
          path: dist/*.deb
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package macOS installer
        run: |
          set -euo pipefail
          mkdir -p "dist/BFlipper Installer/patches"
          cp installers/macos/Install-BFlipper.command "dist/BFlipper Installer/"
          cp patches/installer-*.patch "dist/BFlipper Installer/patches/"
          cp README.md "dist/BFlipper Installer/README.txt"
          chmod +x "dist/BFlipper Installer/Install-BFlipper.command"
          hdiutil create -volname "BFlipper Installer" -srcfolder "dist/BFlipper Installer" -ov -format UDZO "dist/BFlipper-Installer-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: BFlipper-macOS-Installer
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Package Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $scriptDir = Join-Path $env:GITHUB_WORKSPACE 'installers/windows'
          $patchDir = Join-Path $env:GITHUB_WORKSPACE 'patches'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist/BFlipper-Setup.exe'
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DSCRIPTDIR=$scriptDir" "/DPATCHDIR=$patchDir" "/DOUTFILE=$output" installers/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: BFlipper-Windows11-Installer
          path: dist/BFlipper-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
